manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-config-nice_nano
      url: https://github.com/nicekeyboards/zmk-config-nice_nano
      revision: main
      path: modules/hardware/nice_nano
  self:
    path: config